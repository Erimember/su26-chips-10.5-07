databases:
  - name: actionmap-db-07
    databaseName: actionmap
    user: actionmap
    plan: free
    region: oregon

services:
  - type: web
    name: actionmap-07
    runtime: ruby
    plan: free
    region: oregon
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: actionmap-db-07
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: 0
      - key: BUNDLE_WITHOUT
        value: "development:test"